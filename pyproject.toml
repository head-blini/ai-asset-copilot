[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-asset-copilot"
version = "0.0.1"
description = "Personal AI asset management copilot — portfolio foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
web = ["fastapi>=0.115,<1", "jinja2>=3.1,<4", "uvicorn>=0.30,<1"]
web-test = ["pytest>=8,<10", "fastapi>=0.115,<1", "jinja2>=3.1,<4",
            "uvicorn>=0.30,<1", "httpx>=0.27,<1", "playwright>=1.55,<2"]

[project.scripts]
asset-copilot-budget-web = "asset_copilot.web.app:main"

[tool.setuptools.package-data]
"asset_copilot.web" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
